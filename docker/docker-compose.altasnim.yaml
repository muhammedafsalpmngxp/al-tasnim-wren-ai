# Al-Tasnim override: build wren-ai-service from local source instead of pulling the
# prebuilt upstream image, so the customisations in src/altasnim/ take effect.
#
# Usage (from the docker/ directory):
#
#   docker compose -f docker-compose.yaml -f docker-compose.altasnim.yaml \
#       --env-file .env up -d --build wren-ai-service
#
# Everything else (wren-ui, wren-engine, ibis-server, qdrant) keeps using the upstream
# images from docker-compose.yaml.

services:
  wren-ai-service:
    image: al-tasnim/wren-ai-service:dev-2.0
    build:
      context: ../backend/wren-ai-service
      dockerfile: docker/Dockerfile
    environment:
      # Al-Tasnim customisations (see backend/wren-ai-service/src/altasnim/README.md).
      # Set to "false" to fall back to stock Wren AI behaviour.
      ALTASNIM_SELECT_ONLY: ${ALTASNIM_SELECT_ONLY:-true}
      ALTASNIM_DOMAIN_RULES: ${ALTASNIM_DOMAIN_RULES:-true}
